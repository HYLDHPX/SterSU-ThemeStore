name: Publish cloud theme

on:
  workflow_dispatch:
    inputs:
      theme_id:
        description: Stable lowercase theme ID
        required: true
        type: string
      version_code:
        description: Monotonic theme version code
        required: true
        type: string
      package_version:
        description: .kstheme schema version (currently 7)
        required: true
        default: "7"
        type: string
      source_url:
        description: Public GitHub-hosted temporary .kstheme URL
        required: true
        type: string
      asset_name:
        description: Source filename ending in .kstheme
        required: true
        type: string
      sha256:
        description: Expected lowercase SHA-256
        required: true
        type: string
      size_bytes:
        description: Exact package size in bytes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: theme-store-catalog-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download and verify package
        env:
          THEME_ID: ${{ inputs.theme_id }}
          VERSION_CODE: ${{ inputs.version_code }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SOURCE_URL: ${{ inputs.source_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          SIZE_BYTES: ${{ inputs.size_bytes }}
        run: |
          python theme-store/scripts/prepare_release.py \
            --theme-id "$THEME_ID" \
            --version-code "$VERSION_CODE" \
            --package-version "$PACKAGE_VERSION" \
            --source-url "$SOURCE_URL" \
            --asset-name "$ASSET_NAME" \
            --sha256 "$EXPECTED_SHA256" \
            --size-bytes "$SIZE_BYTES" \
            --output-dir /tmp/apkesu-theme-release \
            --repository-root .

      - name: Commit verified repository package
        env:
          THEME_ID: ${{ inputs.theme_id }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-store/packages
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "theme-store: Store ${THEME_ID} v${VERSION_CODE} package"
          git pull --rebase origin main
          git push origin HEAD:main
